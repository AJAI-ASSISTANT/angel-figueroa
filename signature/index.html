<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Figueroa — Email signatures</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0b0c10; color: #e9ebf2; font: 15px/1.6 "Space Grotesk", system-ui, sans-serif; }
  header { text-align: center; padding: 34px 16px 4px; }
  header h1 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .4em; text-transform: uppercase; color: #8a8fa3; }
  header p { margin: 10px auto 0; max-width: 560px; color: #8a8fa3; font-size: 13px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 70px; display: grid; gap: 34px; }
  .opt h2 { margin: 0 0 10px; font-size: 14px; font-weight: 500; letter-spacing: .08em; }
  .opt h2 span { color: #5d6274; margin-right: 8px; }
  /* an email "page" behind each signature, so it is judged where it will live */
  .mail { background: #ffffff; border-radius: 14px; padding: 22px 22px 26px; color: #222; }
  .mail .body { font: 14px/1.6 Arial, sans-serif; color: #333; margin: 0 0 18px; }
  .bar { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  button { font: 500 12px/1 "Space Grotesk"; letter-spacing: .14em; text-transform: uppercase; padding: 12px 16px; border-radius: 10px; border: 0; background: #e9ebf2; color: #0b0c10; cursor: pointer; }
  .ok { font-size: 13px; color: #6dffb4; }
</style>
</head>
<body>
<header>
  <h1>Angel Figueroa · Email signatures</h1>
  <p>Everything is inside the image — name, phone, email and Chime. Tapping it opens his page, where call, text, email and save contact all work.</p>
</header>
<div class="wrap" id="wrap"></div>

<script>
// Where the banner images will live once published (absolute URLs are required in email).
const BASE = window.SIG_BASE || new URL('.', location.href).href;
const LOOKS = [
  ['blue',  'Black and electric blue', '#2f8bff', '#0a1630'],
  ['inter', 'Interstellar',            '#e8963a', '#1a1208'],
  ['lgold', 'Liquid gold',             '#b8862e', '#1f1606'],
  ['laser', 'Laser show',              '#1fbf5a', '#081a10'],
  ['stars', 'Starfield — live',        '#d9a24a', '#5a3a12', 'gif'],
  ['brooklyn', 'Brooklyn night — live', '#d9a24a', '#5a3a12', 'gif'],
];
const PHONE = '929-621-9399', TEL = '+19296219399', EMAIL = 'angellf419@gmail.com', CHIME = '$Angel-Figueroa-48';

// Email-safe: tables, inline styles, web-safe fonts, absolute image URLs, no CSS classes.
// Email-safe: one image carrying every detail, wrapped in a link to his page (where Call,
// Text, Email and Save contact are tappable). The alt text repeats the details for anyone
// whose email app blocks images.
const LINK = window.SIG_LINK || new URL('..', location.href).href;
const ALT = `Angel Figueroa — Event Production · Call/Text ${PHONE} · ${EMAIL} · Chime ${CHIME}`;
const sig = ([id, , acc, deep, ext = 'jpg']) => `
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;width:480px;max-width:100%;">
  <tr><td style="padding:0;">
    <a href="${LINK}" style="text-decoration:none;border:0;"><img src="${BASE}banner-${id}.${ext}" width="480" height="170" alt="${ALT}" title="Angel Figueroa — tap for contact and payment" style="display:block;width:480px;max-width:100%;height:auto;border:0;border-radius:10px;"></a>
  </td></tr>
</table>`;

const wrap = document.getElementById('wrap');
LOOKS.forEach((l, i) => {
  const box = document.createElement('section'); box.className = 'opt';
  box.innerHTML = `<h2><span>0${i + 1}</span>${l[1]}</h2>
    <div class="mail"><p class="body">Hi Jordan,<br><br>Thanks for having us — the lighting plot for Saturday is attached. Load-in is at 2pm.<br><br>Best,</p><div class="sig">${sig(l)}</div></div>
    <div class="bar"><button type="button">Copy signature</button><span class="ok" aria-live="polite"></span></div>`;
  wrap.appendChild(box);
  box.querySelector('button').addEventListener('click', async () => {
    const html = box.querySelector('.sig').innerHTML, ok = box.querySelector('.ok');
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([`Angel Figueroa\nEvent Production\n${PHONE}\n${EMAIL}\nChime: ${CHIME}`], { type: 'text/plain' }) })]);
      ok.textContent = 'Copied — paste it into your signature settings';
    } catch (_) {
      const r = document.createRange(); r.selectNodeContents(box.querySelector('.sig')); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      ok.textContent = 'Selected — press Cmd+C (or Ctrl+C) to copy';
    }
  });
});
</script>
</body>
</html>
