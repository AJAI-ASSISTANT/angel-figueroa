<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Figueroa — Style Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Syne:wght@600;800&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #050507; color: #eef0f4; font: 15px/1.5 "Space Grotesk", system-ui, sans-serif; }
  header { text-align: center; padding: 34px 16px 8px; }
  header h1 { font: 500 13px/1 "Space Grotesk"; letter-spacing: .4em; text-transform: uppercase; color: #8a8fa3; margin: 0; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 28px; padding: 26px 16px 60px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 14px; }
  figcaption b { display: block; font: 500 15px/1.2 "Space Grotesk"; letter-spacing: .06em; }
  figcaption span { font-size: 12px; color: #8a8fa3; }
  figcaption em { display: inline-block; font-style: normal; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; margin: 8px 0 0; border: 1px solid #2a2c35; color: #b9bdcc; }
  figcaption em.shiny { border-color: #6b5a2a; color: #f0d48a; }
  .num { font: 500 11px/1 "Space Grotesk"; color: #5d6274; letter-spacing: .2em; margin-right: 6px; }

  /* the phone */
  .phone { position: relative; width: 300px; height: 620px; border-radius: 44px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 9px #16171c, 0 0 0 10px #2a2c33, 0 40px 90px -30px rgba(0,0,0,.9); isolation: isolate; }
  .phone canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .phone .fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .notch { position: absolute; top: 10px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 20px; background: #000; z-index: 5; }

  /* the card -- translucent glass over the living background */
  .card { position: absolute; left: 16px; right: 16px; bottom: 20px; z-index: 3; padding: 20px 16px 16px; border-radius: 28px;
    background: var(--glass, rgba(10,12,20,.32)); border: 1px solid var(--glass-line, rgba(255,255,255,.16));
    -webkit-backdrop-filter: blur(var(--blur, 16px)) saturate(1.5); backdrop-filter: blur(var(--blur, 16px)) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 20px 50px -20px rgba(0,0,0,.7); }
  .card::before { /* a slow sheen that crosses the glass */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 48%, transparent 60%);
    background-size: 260% 100%; animation: sheen 7s ease-in-out infinite; }
  @keyframes sheen { 0%, 100% { background-position: 130% 0; } 50% { background-position: -30% 0; } }
  .top { position: absolute; top: 58px; left: 0; right: 0; z-index: 3; text-align: center; }
  .av { width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; font: 700 24px/1 var(--display);
    color: var(--ink); background: var(--glass, rgba(10,12,20,.3)); border: 1px solid var(--accent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 0 30px -4px var(--accent); }
  .name { margin: 0 auto; display: inline-block; white-space: nowrap; font: var(--name-font, 700 23px/1.1 "Orbitron"); letter-spacing: var(--name-track, .08em); color: var(--ink);
    text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  .role { margin: 8px 0 0; font: 500 10px/1 "Space Grotesk"; letter-spacing: .34em; text-transform: uppercase; color: var(--accent); text-shadow: 0 1px 12px rgba(0,0,0,.8); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 7px; height: 42px; border-radius: 14px; font-size: 13px; font-weight: 500;
    color: var(--ink); background: var(--btn-bg, rgba(255,255,255,.07)); border: 1px solid var(--glass-line, rgba(255,255,255,.16)); text-decoration: none; }
  .btn.main { background: var(--accent); color: var(--on-accent, #05060a); border-color: transparent; box-shadow: 0 10px 30px -10px var(--accent); }
  .btn svg { width: 15px; height: 15px; }
  .full { grid-column: 1 / -1; }
  .pay { margin-top: 2px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--accent); display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(120deg, rgba(255,255,255,.06), rgba(255,255,255,.01)); }
  .pay small { display: block; font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .pay b { font: 500 15px/1 "Space Grotesk"; color: var(--ink); letter-spacing: .02em; }
  .copy { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 8px 10px; border-radius: 10px; color: var(--on-accent, #05060a); background: var(--accent); }

  /* per-style tokens */
  .s-inter  { --accent: #ffb45c; --ink: #fff4e6; --on-accent: #1a0d00; --display: "Orbitron"; --glass: rgba(8,6,4,.30); --glass-line: rgba(255,200,140,.22); }
  .s-blue   { --accent: #2f8bff; --ink: #e8f2ff; --on-accent: #000814; --display: "Orbitron"; --glass: rgba(0,8,24,.30); --glass-line: rgba(80,160,255,.28); }
  .s-warp   { --accent: #a98bff; --ink: #f1ecff; --on-accent: #0c0420; --display: "Orbitron"; --glass: rgba(6,4,18,.26); --glass-line: rgba(180,160,255,.26); }
  .s-chrome .name, .s-chrome .role, .s-holo .name, .s-holo .role { text-shadow: 0 2px 18px rgba(20,10,60,.55), 0 0 2px rgba(20,10,60,.4); }
  .s-holo   { --accent: #e9f7ff; --ink: #ffffff; --on-accent: #10131c; --display: "Syne"; --name-font: 800 26px/1.05 "Syne"; --name-track: .01em; --glass: rgba(255,255,255,.10); --glass-line: rgba(255,255,255,.38); --blur: 22px; }
  .s-gold   { --accent: #e2b44c; --ink: #f6efe2; --on-accent: #120d02; --display: "Cormorant Garamond"; --name-font: 500 30px/1 "Cormorant Garamond"; --name-track: .02em; --glass: rgba(6,8,18,.34); --glass-line: rgba(226,180,76,.26); }
  .s-nyc    { --accent: #ff4fa3; --ink: #fdf2ff; --on-accent: #1a0010; --display: "Syne"; --name-font: 800 25px/1.05 "Syne"; --name-track: .04em; --glass: rgba(10,6,24,.32); --glass-line: rgba(255,120,200,.24); }
  .s-lgold   { --accent: #ffd98a; --ink: #fffaf0; --on-accent: #2a1a00; --display: "Cormorant Garamond"; --name-font: 500 30px/1 "Cormorant Garamond"; --name-track: .02em; --glass: rgba(20,12,0,.28); --glass-line: rgba(255,220,150,.35); }
  .s-aurora  { --accent: #6dffb4; --ink: #effff7; --on-accent: #00140a; --display: "Space Grotesk"; --name-font: 500 24px/1 "Space Grotesk"; --name-track: .12em; --glass: rgba(0,10,16,.28); --glass-line: rgba(120,255,190,.26); }
  .s-tron    { --accent: #00f0ff; --ink: #e6feff; --on-accent: #001214; --display: "Orbitron"; --glass: rgba(0,6,10,.34); --glass-line: rgba(0,240,255,.32); }
  .s-data    { --accent: #7ffcff; --ink: #ecffff; --on-accent: #001214; --display: "Orbitron"; --glass: rgba(0,8,12,.40); --glass-line: rgba(127,252,255,.26); }
  .s-saturn  { --accent: #f1d6a8; --ink: #fbf3e6; --on-accent: #1e1406; --display: "Cormorant Garamond"; --name-font: 500 30px/1 "Cormorant Garamond"; --name-track: .03em; --glass: rgba(8,8,10,.42); --glass-line: rgba(241,214,168,.22); --blur: 10px; }
  .s-vapor   { --accent: #ff7ad9; --ink: #fff0fb; --on-accent: #22001a; --display: "Syne"; --name-font: 800 25px/1 "Syne"; --name-track: .03em; --glass: rgba(30,4,40,.30); --glass-line: rgba(255,140,220,.30); }
  .s-chrome  { --accent: #f4f6fa; --ink: #ffffff; --on-accent: #0c0e12; --display: "Syne"; --name-font: 800 25px/1 "Syne"; --name-track: .02em; --glass: rgba(10,12,16,.30); --glass-line: rgba(255,255,255,.40); --blur: 20px; }
  .s-bio     { --accent: #39ffe0; --ink: #e8fffb; --on-accent: #00140f; --display: "Space Grotesk"; --name-font: 500 24px/1 "Space Grotesk"; --name-track: .12em; --glass: rgba(0,14,18,.30); --glass-line: rgba(57,255,224,.24); }
  .s-magma   { --accent: #ff7a2f; --ink: #fff1e8; --on-accent: #1c0700; --display: "Syne"; --name-font: 800 25px/1 "Syne"; --name-track: .03em; --glass: rgba(6,4,3,.50); --glass-line: rgba(255,122,47,.24); --blur: 8px; }
  .s-laser   { --accent: #3dff7a; --ink: #f0fff4; --on-accent: #001407; --display: "Orbitron"; --glass: rgba(0,6,4,.34); --glass-line: rgba(61,255,122,.26); }
  .s-prism   { --accent: #ffffff; --ink: #ffffff; --on-accent: #08080c; --display: "Space Grotesk"; --name-font: 500 24px/1 "Space Grotesk"; --name-track: .16em; --glass: rgba(4,4,8,.34); --glass-line: rgba(255,255,255,.26); }
  .s-galaxy  { --accent: #9fd0ff; --ink: #f2f8ff; --on-accent: #020a16; --display: "Orbitron"; --glass: rgba(2,4,12,.30); --glass-line: rgba(159,208,255,.26); }
  .s-concrete{ --accent: #1b1b1d; --ink: #1b1b1d; --on-accent: #f4f2ee; --display: "Syne"; --name-font: 800 25px/1 "Syne"; --name-track: .02em; --glass: rgba(255,255,255,.34); --glass-line: rgba(0,0,0,.10); --btn-bg: rgba(0,0,0,.05); --blur: 14px; }
  .s-concrete .name, .s-concrete .role { text-shadow: none; }
  .s-concrete .pay { background: rgba(255,255,255,.3); }
  .s-wstars, .s-bk { --accent: #ffd59a; --ink: #fff6ea; --on-accent: #1e1406; --display: "Cormorant Garamond"; --name-font: 500 32px/1 "Cormorant Garamond"; --name-track: .01em; --glass: rgba(10,7,4,.30); --glass-line: rgba(255,213,154,.24); }
  .s-wstars .role, .s-bk .role { font-family: Jost, "Space Grotesk", sans-serif; font-weight: 300; }
  .s-nebula { --accent: #4ff0d2; --ink: #f0fffb; --on-accent: #00140f; --display: "Orbitron"; --glass: rgba(6,2,16,.26); --glass-line: rgba(120,255,220,.24); }
  /* elegant type on every look: serif name, light geometric lettering, no digital faces */
  .phone .name { font: 500 33px/1.05 "Cormorant Garamond", Georgia, serif !important; letter-spacing: .01em !important; }
  .phone .av { font: 500 26px/1 "Cormorant Garamond", Georgia, serif !important; letter-spacing: .04em; }
  .phone .role, .phone .pay small, .phone .copy { font-family: Jost, sans-serif !important; font-weight: 400 !important; }
  .phone .role { font-weight: 300 !important; letter-spacing: .3em; }
  .phone .btn { font-family: Jost, sans-serif; font-weight: 400; letter-spacing: .02em; }
  .phone .pay b { font: 400 16px/1 Jost, sans-serif; letter-spacing: .03em; }
  header h1, figcaption b { font-family: Jost, sans-serif; font-weight: 400; }
  figcaption b { font: 500 21px/1.2 "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; }
</style>
</head>
<body>
<header><h1>Angel Figueroa · Style lab</h1></header>
<div class="grid" id="grid"></div>

<template id="card">
  <div class="notch"></div>
  <div class="top">
    <div class="av">AF</div>
    <p class="name">ANGEL FIGUEROA</p>
    <p class="role">Event production · Everywhere</p>
  </div>
  <div class="card">
    <div class="row">
      <a class="btn main" href="tel:+19296219399"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Call</a>
      <a class="btn" href="sms:+19296219399"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>Text</a>
      <a class="btn" href="mailto:angellf419@gmail.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>
      <a class="btn" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Save contact</a>
    </div>
    <div class="pay"><div><small>Pay with Chime</small><b>$Angel-Figueroa-48</b></div><span class="copy">Copy</span></div>
  </div>
</template>

<script>
const STYLES = [
  ['inter',    'Interstellar',            'A black hole bending light, stars drifting past', 'shiny'],
  ['blue',     'Black and electric blue', 'Plasma ribbons over a glowing grid', 'shiny'],
  ['warp',     'Hyperspace',              'Stars stretching into light speed', 'shiny'],
  ['holo',     'Holographic chrome',      'Liquid iridescence, frosted glass', 'shiny'],
  ['gold',     'Gold constellation',      'Points of light that connect as they drift', 'matte'],
  ['nyc',      'Midnight NYC',            'Skyline, lit windows, neon rain', 'matte'],
  ['nebula',   'Cosmic nebula',           'Teal and magenta gas clouds, slow and deep', 'matte'],
  ['lgold',    'Liquid gold',             'Molten metal rolling in slow waves', 'shiny'],
  ['aurora',   'Aurora',                  'Northern lights curtains over a night sky', 'matte'],
  ['tron',     'Circuit grid',            'Light racing along a neon circuit board', 'shiny'],
  ['data',     'Data rain',               'Falling code in ice blue', 'matte'],
  ['saturn',   'Saturn',                  'A ringed planet turning in deep space', 'matte'],
  ['vapor',    'Synthwave sunset',        'Striped sun, neon mountains, endless grid', 'shiny'],
  ['chrome',   'Liquid chrome',           'Mercury blobs merging and splitting', 'shiny'],
  ['bio',      'Bioluminescence',         'Glowing jellyfish in the deep ocean', 'matte'],
  ['magma',    'Obsidian magma',          'Black stone with lava breathing in the cracks', 'matte'],
  ['laser',    'Laser show',              'Stage lasers sweeping through haze -- his craft', 'shiny'],
  ['prism',    'Prism',                   'White light splitting into a rainbow', 'shiny'],
  ['galaxy',   'Spiral galaxy',           'A slowly turning galaxy, billions of stars', 'matte'],
  ['concrete', 'Gallery concrete',        'Matte stone with sunlight through blinds', 'matte'],
  ['wstars',   'Warm starfield',          'Matches signature 05 -- gold and ivory stars breathing', 'matte'],
  ['bk',       'Brooklyn night',          'Matches signature 06 -- the bridge under the stars', 'matte'],
];
const grid = document.getElementById('grid'), tpl = document.getElementById('card');
const scenes = [];
let n = 0;
for (const [id, title, sub, finish] of STYLES) {
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="phone s-${id}"><canvas></canvas></div><figcaption><b><span class="num">${String(++n).padStart(2, '0')}</span>${title}</b><span>${sub}</span><br><em class="${finish}">${finish}</em></figcaption>`;
  const ph = fig.querySelector('.phone'); ph.appendChild(tpl.content.cloneNode(true));
  ph.querySelector('.name').textContent = 'Angel Figueroa';
  grid.appendChild(fig);
  const c = ph.querySelector('canvas'), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = 300 * dpr; c.height = 620 * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
  scenes.push({ id, c, x, W: 300, H: 620, visible: true, s: {} });
}
const R = (a, b) => a + Math.random() * (b - a);

/* ---------- scene painters: each gets (ctx, W, H, t, state) ---------- */
const P = {
  inter(x, W, H, t, s) {
    if (!s.stars) s.stars = Array.from({ length: 260 }, () => ({ x: R(0, W), y: R(0, H), r: R(.2, 1.3), a: R(.2, 1), v: R(.02, .12) }));
    x.fillStyle = '#020104'; x.fillRect(0, 0, W, H);
    for (const p of s.stars) { p.x -= p.v; if (p.x < 0) p.x = W; x.globalAlpha = p.a * (.6 + .4 * Math.sin(t * 2 + p.y)); x.fillStyle = '#fff'; x.fillRect(p.x, p.y, p.r, p.r); }
    x.globalAlpha = 1;
    const cx = W / 2, cy = H * .47, rr = 50;
    x.globalCompositeOperation = 'lighter';
    // lensed ring above and below the shadow
    for (let k = 0; k < 2; k++) {
      const g = x.createRadialGradient(cx, cy, rr * .9, cx, cy, rr * 1.9);
      g.addColorStop(0, 'rgba(255,240,210,.95)'); g.addColorStop(.18, 'rgba(255,170,80,.55)'); g.addColorStop(.55, 'rgba(200,80,20,.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, rr * 1.9, rr * 1.9 * (k ? .95 : 1), 0, 0, Math.PI * 2); x.fill();
    }
    // the accretion disc, edge on, with a turbulent shimmer
    for (let i = 0; i < 70; i++) {
      const a = (i / 70) * Math.PI * 2 + t * .35, w = 130 + 28 * Math.sin(i * 1.7 + t), h = 15;
      const px = cx + Math.cos(a) * w, py = cy + Math.sin(a) * h;
      const front = Math.sin(a) > 0, sz = front ? 22 : 14;
      const g = x.createRadialGradient(px, py, 0, px, py, sz);
      g.addColorStop(0, front ? 'rgba(255,230,180,.55)' : 'rgba(255,150,60,.25)'); g.addColorStop(1, 'rgba(255,120,30,0)');
      x.fillStyle = g; x.fillRect(px - sz, py - sz, sz * 2, sz * 2);
    }
    x.globalCompositeOperation = 'source-over';
    x.fillStyle = '#000'; x.beginPath(); x.arc(cx, cy, rr * .92, 0, Math.PI * 2); x.fill();
    // photon ring
    x.strokeStyle = 'rgba(255,235,200,.9)'; x.lineWidth = 1.3; x.beginPath(); x.arc(cx, cy, rr * .95, 0, Math.PI * 2); x.stroke();
    // front of the disc passes in front of the shadow
    x.globalCompositeOperation = 'lighter';
    const g2 = x.createLinearGradient(cx - 150, 0, cx + 150, 0);
    g2.addColorStop(0, 'rgba(255,140,50,0)'); g2.addColorStop(.5, 'rgba(255,230,190,.85)'); g2.addColorStop(1, 'rgba(255,140,50,0)');
    x.fillStyle = g2; x.beginPath(); x.ellipse(cx, cy + 4, 150, 6 + 1.5 * Math.sin(t * 1.3), 0, 0, Math.PI * 2); x.fill();
    x.globalCompositeOperation = 'source-over';
  },
  blue(x, W, H, t) {
    x.fillStyle = '#000208'; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 5; k++) {
      x.beginPath();
      for (let i = 0; i <= 60; i++) {
        const px = (i / 60) * W, py = H * (.25 + k * .1) + Math.sin(i * .18 + t * (.6 + k * .15) + k) * (26 + k * 6) + Math.sin(i * .07 - t * .4) * 30;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.lineWidth = 18 - k * 2.5; x.strokeStyle = `rgba(${30 + k * 20},${110 + k * 25},255,.10)`; x.stroke();
      x.lineWidth = 1.2; x.strokeStyle = `rgba(${120 + k * 20},200,255,.55)`; x.stroke();
    }
    // perspective grid floor
    const hz = H * .62; x.lineWidth = 1;
    for (let i = -14; i <= 14; i++) { x.strokeStyle = 'rgba(47,139,255,.22)'; x.beginPath(); x.moveTo(W / 2 + i * 8, hz); x.lineTo(W / 2 + i * 60, H); x.stroke(); }
    for (let j = 0; j < 14; j++) { const f = ((j + (t * .6) % 1) / 14) ** 2; const y = hz + (H - hz) * f; x.strokeStyle = `rgba(47,139,255,${.08 + f * .3})`; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
    const g = x.createRadialGradient(W / 2, hz, 0, W / 2, hz, 220); g.addColorStop(0, 'rgba(47,139,255,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'source-over';
  },
  warp(x, W, H, t, s) {
    if (!s.st) s.st = Array.from({ length: 360 }, () => ({ a: R(0, 6.283), d: R(1, 300), v: R(.6, 2.2), h: R(220, 290) }));
    x.fillStyle = 'rgba(3,2,10,.35)'; x.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H * .36;
    x.globalCompositeOperation = 'lighter';
    for (const p of s.st) {
      const d0 = p.d; p.d *= 1 + .012 * p.v; if (p.d > 520) { p.d = R(1, 20); }
      const x0 = cx + Math.cos(p.a) * d0, y0 = cy + Math.sin(p.a) * d0, x1 = cx + Math.cos(p.a) * p.d, y1 = cy + Math.sin(p.a) * p.d;
      x.strokeStyle = `hsla(${p.h},100%,${60 + Math.min(30, p.d / 10)}%,${Math.min(1, p.d / 140)})`; x.lineWidth = Math.min(2.2, p.d / 120);
      x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    }
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, 90); g.addColorStop(0, 'rgba(200,180,255,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);

/* ---------- theme twinkle: sharp points of light that breathe on two rhythms ---------- */
const TWINKLE = {

  gold:   { c: ['#ffe7b0', '#ffd27a'], n: 50, g: .3 },               nyc:    { c: ['#ffd9a8', '#ffc6e8', '#ffffff'], n: 30 },
  nebula: { c: ['#d7fff6', '#ffd1f4', '#ffffff'], n: 70 },           lgold:  { c: ['#fff6d8', '#ffffff'], n: 45, g: .6 },
  aurora: { c: ['#e6fff2', '#ffffff', '#d9cfff'], n: 60 },           tron:   { c: ['#c8fdff', '#ffffff'], n: 35 },

  laser:  { c: ['#c9ffd9', '#bfe8ff', '#ffffff'], n: 40 },           prism:  { c: ['#ffd1d1', '#fff2b8', '#c8ffd8', '#c9e6ff', '#e6d1ff', '#ffffff'], n: 55 },
  galaxy: { c: ['#dbe9ff', '#ffd6f2', '#ffffff'], n: 70 },           concrete: { c: ['#fff4dc', '#ffffff'], n: 60, dust: true },
  wstars: { c: ['#fff2dc', '#ffd9a6'], n: 24, g: .4 },               bk:     { c: ['#fff2dc', '#ffd9a6'], n: 24, g: .4, top: .6 },
